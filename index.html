<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 대입전형 일정</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v9/v10 Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: bold; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Firebase 설정 영역 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCLVntOsMvUw8i15a1wqogHo3ikijlm5r4",
            authDomain: "mj-3rd.firebaseapp.com",
            projectId: "mj-3rd",
            storageBucket: "mj-3rd.firebasestorage.app",
            messagingSenderId: "392748781039",
            appId: "1:392748781039:web:4e69d9a52cb473a4f5fa1a"
        };

        // Firebase 초기화
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log("Firebase Firestore가 성공적으로 연결되었습니다.");
        } catch (e) {
            console.error("Firebase 초기화 중 에러 발생:", e);
        }
    </script>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid me-2 fa-calendar-check text-blue-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-slate-900">2026학년도 대입전형 일정 관리</h1>
                    <span id="sync-status" class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full font-medium">실시간 동기화 중</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center shadow-sm">
                        <i class="fa-solid fa-plus mr-1.5"></i> 일정 등록
                    </button>
                    <button onclick="openBatchModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-medium text-sm transition flex items-center">
                        <i class="fa-solid fa-file-import mr-1.5"></i> 엑셀 일괄 추가
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 no-print">
        <!-- 필터 및 검색 바 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-3 items-center flex-1">
                <div class="relative min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="대학명, 전형명, 항목 검색..." oninput="renderApp()" class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <select id="month-filter" onchange="renderApp()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">전체 월</option>
                    <option value="09">9월</option>
                    <option value="10">10월</option>
                    <option value="11">11월</option>
                    <option value="12">12월</option>
                </select>
                <select id="type-filter" onchange="renderApp()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">전체 전형</option>
                    <option value="수시">수시</option>
                    <option value="정시">정시</option>
                </select>
            </div>
            <div class="text-sm text-slate-500">
                총 <span id="item-count" class="font-bold text-blue-600">0</span>건의 일정
            </div>
        </div>

        <!-- 일정이 표시될 영역 -->
        <div id="schedule-list" class="space-y-4">
            <!-- JavaScript로 내용이 채워집니다 -->
        </div>
    </main>

    <!-- 모달 등 스크립트 로직 -->
    <script>
        let schedules = [];

        // 데이터 로드 (Firestore 및 LocalStorage 지원)
        function initDataSync() {
            if (db) {
                db.collection("schedules").onSnapshot((snapshot) => {
                    schedules = [];
                    snapshot.forEach((doc) => {
                        schedules.push({ id: doc.id, ...doc.data() });
                    });
                    renderApp();
                }, (error) => {
                    console.error("Firestore 실시간 수신 에러:", error);
                    loadLocalData();
                });
            } else {
                document.getElementById('sync-status').innerText = '로컬 저장 모드';
                document.getElementById('sync-status').className = 'text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium';
                loadLocalData();
            }
        }

        function loadLocalData() {
            const local = localStorage.getItem('schedules');
            schedules = local ? JSON.parse(local) : [];
            renderApp();
        }

        function renderApp() {
            const listEl = document.getElementById('schedule-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const month = document.getElementById('month-filter').value;
            const type = document.getElementById('type-filter').value;

            let filtered = schedules.filter(item => {
                const matchSearch = (item.university || '').toLowerCase().includes(search) || 
                                    (item.title || '').toLowerCase().includes(search);
                const matchType = type === 'all' || item.type === type;
                const matchMonth = month === 'all' || (item.date && item.date.substring(5, 7) === month);
                return matchSearch && matchType && matchMonth;
            });

            document.getElementById('item-count').innerText = filtered.length;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="bg-white p-12 text-center rounded-xl border border-slate-200 text-slate-400">등록된 일정이 없습니다.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center hover:border-blue-300 transition">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="px-2 py-0.5 text-xs font-semibold rounded ${item.type === '수시' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${item.type || '전형'}</span>
                            <h3 class="font-bold text-slate-800 text-lg">${item.university || '대학명 미정'}</h3>
                        </div>
                        <p class="text-sm text-slate-600">${item.title || '일정 내용 없음'}</p>
                        <p class="text-xs text-slate-400 mt-1"><i class="fa-regular fa-clock mr-1"></i>${item.date || '날짜 미정'}</p>
                    </div>
                </div>
            `).join('');
        }

        window.onload = function() {
            initDataSync();
        };
    </script>
</body>
</html>
