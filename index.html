<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 대입전형 일정</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Firebase 설정 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCLVntOsMvUw8i15a1wqogHo3ikijlm5r4",
            authDomain: "mj-3rd.firebaseapp.com",
            projectId: "mj-3rd",
            storageBucket: "mj-3rd.firebasestorage.app",
            messagingSenderId: "392748781039",
            appId: "1:392748781039:web:4e69d9a52cb473a4f5fa1a"
        };

        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log("Firebase Firestore 연결 완료");
        } catch (e) {
            console.error("Firebase 연결 실패:", e);
        }
    </script>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-calendar-check text-blue-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-slate-900">2026 대입 면접 및 전형 일정</h1>
                    <span id="sync-status" class="text-xs bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-medium">실시간 동기화 중</span>
                </div>
                <div>
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center shadow-sm">
                        <i class="fa-solid fa-plus mr-1.5"></i> 일정 등록
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- 필터 및 검색 바 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-3 items-center flex-1">
                <div class="relative min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="대학명, 전형 내용 검색..." oninput="renderApp()" class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <select id="type-filter" onchange="renderApp()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">전체 구분</option>
                    <option value="수시">수시</option>
                    <option value="정시">정시</option>
                    <option value="면접">면접</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            <div class="text-sm text-slate-500">
                총 <span id="item-count" class="font-bold text-blue-600">0</span>건
            </div>
        </div>

        <!-- 일정 목록 영역 -->
        <div id="schedule-list" class="space-y-3"></div>
    </main>

    <!-- 일정 등록/수정 모달 팝업 -->
    <div id="schedule-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-lg font-bold text-slate-900">새 일정 등록</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="schedule-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="form-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">구분</label>
                    <select id="form-type" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="수시">수시</option>
                        <option value="정시">정시</option>
                        <option value="면접">면접</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">대학명 *</label>
                    <input type="text" id="form-university" required placeholder="예: 서울대학교" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">전형 내용/학과 *</label>
                    <input type="text" id="form-title" required placeholder="예: 학생부종합 면접고사" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">일시/날짜 *</label>
                    <input type="text" id="form-date" required placeholder="예: 2026-10-15 14:00" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-lg text-sm font-medium transition">취소</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium transition">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 동기화 및 모달 제어 로직 -->
    <script>
        let schedules = [];

        function initDataSync() {
            if (db) {
                db.collection("schedules").onSnapshot((snapshot) => {
                    schedules = [];
                    snapshot.forEach((doc) => {
                        schedules.push({ id: doc.id, ...doc.data() });
                    });
                    renderApp();
                }, (error) => {
                    console.error("Firestore 연결 오류:", error);
                    alert("데이터를 불러오는데 실패했습니다. Firestore 규칙(테스트 모드)을 확인해주세요.");
                });
            }
        }

        function renderApp() {
            const listEl = document.getElementById('schedule-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const type = document.getElementById('type-filter').value;

            let filtered = schedules.filter(item => {
                const matchSearch = (item.university || '').toLowerCase().includes(search) || 
                                    (item.title || '').toLowerCase().includes(search);
                const matchType = type === 'all' || item.type === type;
                return matchSearch && matchType;
            });

            document.getElementById('item-count').innerText = filtered.length;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="bg-white p-12 text-center rounded-xl border border-slate-200 text-slate-400">등록된 일정이 없습니다. [일정 등록] 버튼을 눌러 추가해 보세요!</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => `
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center hover:border-blue-300 transition">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="px-2 py-0.5 text-xs font-semibold rounded ${getTypeBadge(item.type)}">${item.type}</span>
                            <h3 class="font-bold text-slate-800 text-base">${escapeHtml(item.university)}</h3>
                        </div>
                        <p class="text-sm text-slate-600">${escapeHtml(item.title)}</p>
                        <p class="text-xs text-slate-400 mt-1"><i class="fa-regular fa-clock mr-1"></i>${escapeHtml(item.date)}</p>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="deleteSchedule('${item.id}')" class="text-slate-400 hover:text-red-500 p-2 transition"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function getTypeBadge(type) {
            switch(type) {
                case '수시': return 'bg-blue-100 text-blue-700';
                case '정시': return 'bg-purple-100 text-purple-700';
                case '면접': return 'bg-amber-100 text-amber-700';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        function openModal() {
            document.getElementById('schedule-form').reset();
            document.getElementById('form-id').value = '';
            document.getElementById('modal-title').innerText = '새 일정 등록';
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const university = document.getElementById('form-university').value;
            const title = document.getElementById('form-title').value;
            const date = document.getElementById('form-date').value;
            const type = document.getElementById('form-type').value;

            if (!db) {
                alert("데이터베이스 연결에 문제가 있습니다.");
                return;
            }

            try {
                await db.collection("schedules").add({
                    university, title, date, type, createdAt: new Date()
                });
                closeModal();
            } catch (error) {
                console.error("일정 저장 오류:", error);
                alert("일정 저장에 실패했습니다. Firestore 보안 규칙을 확인해보세요.");
            }
        }

        async function deleteSchedule(id) {
            if (confirm("정말 이 일정을 삭제하시겠습니까?")) {
                try {
                    await db.collection("schedules").doc(id).delete();
                } catch (error) {
                    console.error("삭제 오류:", error);
                    alert("삭제 실패!");
                }
            }
        }

        function escapeHtml(text) {
            return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = function() {
            initDataSync();
        };
    </script>
</body>
</html>
