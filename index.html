<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 대입 면접·논술 일정 관리</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar CSS & JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .fc-event { cursor: pointer; border: none !important; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: bold; }

        /* 🖨️ A4 용지 완벽 맞춤 인쇄 스타일 */
        @media print {
            /* 목록 보기 기본: A4 세로 */
            @page {
                size: A4 portrait;
                margin: 8mm;
            }

            /* 달력 보기 시 A4 가로 방향 강제 설정 */
            body.is-calendar-view @page {
                size: A4 landscape;
                margin: 5mm;
            }

            /* 불필요한 레이아웃 숨기기 */
            header, 
            #class-tab-group-container, 
            #filter-bar, 
            .no-print,
            button {
                display: none !important;
            }

            body, main {
                background: white !important;
                color: black !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 1. 목록 보기 스타일 */
            #view-list-container {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 10px !important;
            }

            #view-list-container > div {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
            }

            /* 2. 달력 보기 A4 가로 한 장 완벽 맞춤 스타일 */
            #view-calendar-container {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                border: none !important;
                box-shadow: none !important;
                overflow: hidden !important;
            }

            #calendar {
                width: 100% !important;
                max-width: 100% !important;
            }

            .fc {
                width: 100% !important;
                max-width: 100% !important;
                height: 180mm !important; /* A4 가로 높이에 딱 맞게 고정 */
            }

            .fc table {
                width: 100% !important;
                table-layout: fixed !important; /* 요일 셀 비율 동일 유지 (토요일 안잘림) */
            }

            .fc-col-header-cell, .fc-daygrid-day {
                width: 14.28% !important; /* 7등분 정확히 고정 */
            }

            .fc-daygrid-day-frame {
                min-height: 0 !important;
            }

            .fc-event-title {
                font-size: 10px !important;
                font-weight: bold;
            }

            .fc-toolbar {
                margin-bottom: 5px !important;
            }

            .fc-toolbar-title {
                font-size: 1.2rem !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-graduation-cap text-blue-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-slate-900">2026 대입 면접·논술 일정</h1>
                    <span id="sync-status" class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium">연결 중...</span>
                </div>
                <div class="flex items-center space-x-2">
                    <!-- 보기 방식 전환 -->
                    <div class="bg-slate-100 p-1 rounded-lg flex space-x-1 mr-1">
                        <button id="btn-view-list" onclick="switchView('list')" class="px-3 py-1.5 rounded-md text-xs font-bold bg-white text-blue-600 shadow-sm transition">
                            <i class="fa-solid fa-list mr-1"></i>목록
                        </button>
                        <button id="btn-view-cal" onclick="switchView('calendar')" class="px-3 py-1.5 rounded-md text-xs font-bold text-slate-600 hover:text-slate-900 transition">
                            <i class="fa-regular fa-calendar-days mr-1"></i>달력
                        </button>
                    </div>

                    <!-- 프린트 버튼 -->
                    <button onclick="triggerPrint()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-2 rounded-lg font-medium text-xs transition flex items-center shadow">
                        <i class="fa-solid fa-print mr-1.5"></i> 인쇄하기
                    </button>

                    <!-- 엑셀 일괄 등록 버튼 -->
                    <button onclick="openBatchModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg font-medium text-xs transition flex items-center shadow">
                        <i class="fa-solid fa-file-excel mr-1.5"></i> 엑셀 등록
                    </button>

                    <!-- 개별 등록 버튼 -->
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-medium text-xs transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1.5"></i> 일정 등록
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- 1반 ~ 9반 필터 탭 -->
        <div id="class-tab-group-container" class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 mb-6">
            <div class="text-xs font-semibold text-slate-400 mb-2 px-1">학급 선택</div>
            <div class="flex flex-wrap gap-1.5" id="class-tab-group">
                <button onclick="filterClass('all')" class="class-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="all">전체</button>
                <button onclick="filterClass('1반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="1반">1반</button>
                <button onclick="filterClass('2반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="2반">2반</button>
                <button onclick="filterClass('3반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="3반">3반</button>
                <button onclick="filterClass('4반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="4반">4반</button>
                <button onclick="filterClass('5반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="5반">5반</button>
                <button onclick="filterClass('6반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="6반">6반</button>
                <button onclick="filterClass('7반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="7반">7반</button>
                <button onclick="filterClass('8반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="8반">8반</button>
                <button onclick="filterClass('9반')" class="class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition" data-class="9반">9반</button>
            </div>
        </div>

        <!-- 검색 필터 -->
        <div id="filter-bar" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-3 items-center flex-1">
                <div class="relative min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="학생 이름, 학교명 검색..." oninput="renderApp()" class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <select id="type-filter" onchange="renderApp()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="all">전체 구분 (면접/논술)</option>
                    <option value="면접">면접</option>
                    <option value="논술">논술</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            <div class="text-sm text-slate-500">
                총 <span id="item-count" class="font-bold text-blue-600">0</span>건
            </div>
        </div>

        <!-- 1. 목록 보기 -->
        <div id="view-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <!-- 2. 달력 보기 -->
        <div id="view-calendar-container" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hidden">
            <div id="calendar"></div>
        </div>
    </main>

    <!-- 개별 일정 등록 모달 -->
    <div id="schedule-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-900">학생 면접/논술 일정 등록</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="schedule-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">반 선택 *</label>
                        <select id="form-class" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="1반">1반</option><option value="2반">2반</option><option value="3반">3반</option>
                            <option value="4반">4반</option><option value="5반">5반</option><option value="6반">6반</option>
                            <option value="7반">7반</option><option value="8반">8반</option><option value="9반">9반</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">구분 *</label>
                        <select id="form-type" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="면접">면접</option><option value="논술">논술</option><option value="기타">기타</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">학생 이름 *</label>
                    <input type="text" id="form-student" required placeholder="예: 홍길동" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">지원 학교 / 학과 *</label>
                    <input type="text" id="form-university" required placeholder="예: 한국대학교 컴퓨터공학과" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">시험 날짜 *</label>
                    <input type="date" id="form-date-picker" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none mb-1">
                    <input type="text" id="form-date-text" placeholder="상세 시간 (예: 14:00)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-lg text-sm font-medium transition">취소</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium transition">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 엑셀 일괄 등록 모달 -->
    <div id="batch-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-900">엑셀(CSV) 일괄 등록</h2>
                <button onclick="closeBatchModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="space-y-4">
                <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs text-blue-800 space-y-1">
                    <p class="font-bold">💡 엑셀 업로드 안내</p>
                    <p>엑셀 파일 작성 후 <strong>[다른 이름으로 저장 ➔ CSV UTF-8]</strong> 형식으로 저장하여 업로드해 주세요.</p>
                    <button onclick="downloadSampleCsv()" class="underline font-bold text-blue-600 hover:text-blue-800 mt-1 inline-block">
                        <i class="fa-solid fa-download mr-1"></i>샘플 양식 다운로드
                    </button>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">CSV 파일 선택</label>
                    <input type="file" id="csv-file-input" accept=".csv" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeBatchModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-lg text-sm font-medium transition">취소</button>
                    <button type="button" onclick="processCsvUpload()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg text-sm font-medium transition">일괄 올리기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCLVntOsMvUw8i15a1wqogHo3ikijlm5r4",
            authDomain: "mj-3rd.firebaseapp.com",
            projectId: "mj-3rd",
            storageBucket: "mj-3rd.firebasestorage.app",
            messagingSenderId: "392748781039",
            appId: "1:392748781039:web:4e69d9a52cb473a4f5fa1a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let schedules = [];
        let currentClass = 'all';
        let currentView = 'list';
        let calendar = null;

        function initDataSync() {
            db.collection("schedules").onSnapshot((snapshot) => {
                schedules = [];
                snapshot.forEach((doc) => {
                    schedules.push({ id: doc.id, ...doc.data() });
                });
                document.getElementById('sync-status').innerText = '실시간 동기화 중';
                document.getElementById('sync-status').className = 'text-xs bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-medium';
                renderApp();
            }, (error) => {
                console.error("Firestore error:", error);
                document.getElementById('sync-status').innerText = '연결 오류 (규칙 확인 필요)';
                document.getElementById('sync-status').className = 'text-xs bg-red-100 text-red-800 px-2.5 py-1 rounded-full font-medium';
            });
        }

        function switchView(view) {
            currentView = view;
            const btnList = document.getElementById('btn-view-list');
            const btnCal = document.getElementById('btn-view-cal');
            const listContainer = document.getElementById('view-list-container');
            const calContainer = document.getElementById('view-calendar-container');
            const filterBar = document.getElementById('filter-bar');

            if (view === 'list') {
                document.body.classList.remove('is-calendar-view');
                btnList.className = "px-3 py-1.5 rounded-md text-xs font-bold bg-white text-blue-600 shadow-sm transition";
                btnCal.className = "px-3 py-1.5 rounded-md text-xs font-bold text-slate-600 hover:text-slate-900 transition";
                listContainer.classList.remove('hidden');
                calContainer.classList.add('hidden');
                filterBar.classList.remove('hidden');
            } else {
                document.body.classList.add('is-calendar-view');
                btnCal.className = "px-3 py-1.5 rounded-md text-xs font-bold bg-white text-blue-600 shadow-sm transition";
                btnList.className = "px-3 py-1.5 rounded-md text-xs font-bold text-slate-600 hover:text-slate-900 transition";
                listContainer.classList.add('hidden');
                calContainer.classList.remove('hidden');
                filterBar.classList.add('hidden');
                initCalendar();
            }
            renderApp();
        }

        function filterClass(className) {
            currentClass = className;
            document.querySelectorAll('.class-tab').forEach(btn => {
                if (btn.getAttribute('data-class') === className) {
                    btn.className = "class-tab bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition";
                } else {
                    btn.className = "class-tab bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium transition";
                }
            });
            renderApp();
        }

        function renderApp() {
            const filtered = schedules.filter(item => {
                const matchClass = currentClass === 'all' || item.className === currentClass;
                const search = document.getElementById('search-input').value.toLowerCase();
                const type = document.getElementById('type-filter').value;
                const matchType = type === 'all' || item.type === type;
                const matchSearch = (item.studentName || '').toLowerCase().includes(search) || 
                                    (item.university || '').toLowerCase().includes(search);
                return matchClass && matchType && matchSearch;
            });

            document.getElementById('item-count').innerText = filtered.length;

            if (currentView === 'list') {
                const listEl = document.getElementById('view-list-container');
                if (filtered.length === 0) {
                    listEl.innerHTML = `<div class="col-span-full bg-white p-12 text-center rounded-xl border border-slate-200 text-slate-400">등록된 일정이 없습니다.</div>`;
                    return;
                }
                listEl.innerHTML = filtered.map(item => `
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-start hover:border-blue-300 transition">
                        <div>
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="px-2 py-0.5 text-xs font-bold rounded bg-slate-800 text-white">${escapeHtml(item.className || '반미정')}</span>
                                <span class="px-2 py-0.5 text-xs font-semibold rounded ${item.type === '면접' ? 'bg-amber-100 text-amber-800' : 'bg-purple-100 text-purple-800'}">${escapeHtml(item.type)}</span>
                                <span class="font-bold text-slate-900 text-base">${escapeHtml(item.studentName)}</span>
                            </div>
                            <h4 class="font-semibold text-slate-700 text-sm mb-1"><i class="fa-solid fa-university mr-1.5 text-slate-400"></i>${escapeHtml(item.university)}</h4>
                            <p class="text-xs text-slate-500"><i class="fa-regular fa-clock mr-1 text-slate-400"></i>${escapeHtml(item.dateIso)} ${escapeHtml(item.timeText || '')}</p>
                        </div>
                        <button onclick="deleteSchedule('${item.id}')" class="text-slate-300 hover:text-red-500 p-1.5 transition no-print"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');
            } else if (calendar) {
                const events = filtered.map(item => ({
                    id: item.id,
                    title: `[${item.className}] ${item.studentName} (${item.type})`,
                    start: item.dateIso,
                    backgroundColor: item.type === '면접' ? '#f59e0b' : '#8b5cf6'
                }));
                calendar.removeAllEvents();
                calendar.addEventSource(events);
            }
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            if (!calendar) {
                calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    locale: 'ko',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,listMonth'
                    },
                    eventClick: function(info) {
                        if (confirm(`'${info.event.title}' 일정을 삭제하시겠습니까?`)) {
                            deleteSchedule(info.event.id);
                        }
                    }
                });
                calendar.render();
            } else {
                calendar.render();
            }
        }

        function triggerPrint() {
            if (currentView === 'calendar' && calendar) {
                calendar.updateSize();
            }
            setTimeout(() => {
                window.print();
            }, 150);
        }

        function openModal() {
            document.getElementById('schedule-form').reset();
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        function openBatchModal() {
            document.getElementById('csv-file-input').value = '';
            document.getElementById('batch-modal').classList.remove('hidden');
        }

        function closeBatchModal() {
            document.getElementById('batch-modal').classList.add('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const className = document.getElementById('form-class').value;
            const type = document.getElementById('form-type').value;
            const studentName = document.getElementById('form-student').value;
            const university = document.getElementById('form-university').value;
            const dateIso = document.getElementById('form-date-picker').value;
            const timeText = document.getElementById('form-date-text').value;

            try {
                await db.collection("schedules").add({
                    className, type, studentName, university, dateIso, timeText, createdAt: new Date()
                });
                closeModal();
            } catch (error) {
                alert("저장에 실패했습니다. Firebase 규칙을 확인하세요.");
            }
        }

        async function processCsvUpload() {
            const fileInput = document.getElementById('csv-file-input');
            if (!fileInput.files.length) {
                alert("CSV 파일을 선택해주세요.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                let count = 0;

                const batch = db.batch();

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const cols = line.split(',').map(col => col.trim().replace(/^"|"$/g, ''));
                    if (cols.length >= 5) {
                        const [className, type, studentName, university, dateIso, timeText] = cols;
                        const docRef = db.collection("schedules").doc();
                        batch.set(docRef, {
                            className: className || '1반',
                            type: type || '면접',
                            studentName: studentName || '이름없음',
                            university: university || '학교미정',
                            dateIso: dateIso || '2026-10-01',
                            timeText: timeText || '',
                            createdAt: new Date()
                        });
                        count++;
                    }
                }

                if (count > 0) {
                    await batch.commit();
                    alert(`${count}건의 일정이 성공적으로 등록되었습니다!`);
                    closeBatchModal();
                } else {
                    alert("올바른 데이터 형식이 없습니다. 샘플 양식을 확인해주세요.");
                }
            };

            reader.readAsText(file, 'UTF-8');
        }

        function downloadSampleCsv() {
            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" 
                + "학급,구분,학생이름,지원학교/학과,날짜(YYYY-MM-DD),시간\n"
                + "1반,면접,홍길동,한국대학교 컴퓨터공학과,2026-10-15,14:00\n"
                + "2반,논술,김철수,서울대학교 경영학과,2026-10-20,09:30";
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "면접논술_일정_양식.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function deleteSchedule(id) {
            if (confirm("일정을 삭제하시겠습니까?")) {
                try {
                    await db.collection("schedules").doc(id).delete();
                } catch (error) {
                    alert("삭제 오류가 발생했습니다.");
                }
            }
        }

        function escapeHtml(text) {
            return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = function() {
            initDataSync();
        };
    </script>
</body>
</html>
